<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Voice Capture</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%232563EB'/%3E%3Cpath fill='%23fff' d='M13 14h12a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H13a4 4 0 0 1-4-4v-8a4 4 0 0 1 4-4z'/%3E%3Ccircle cx='15' cy='21' r='2.2' fill='%231E3A8A'/%3E%3Ccircle cx='23' cy='21' r='2.2' fill='%231E3A8A'/%3E%3Cpath fill='%23fff' d='M37 15a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0v-6a3 3 0 0 1 3-3z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="logo" href="#/">
        <svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true">
          <rect width="48" height="48" rx="12" fill="#2563EB"/>
          <circle cx="19" cy="8.5" r="2" fill="#fff"/><rect x="18.2" y="9" width="1.6" height="5" fill="#fff"/>
          <path fill="#fff" d="M13 14h12a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H13a4 4 0 0 1-4-4v-8a4 4 0 0 1 4-4z"/>
          <circle cx="15" cy="21" r="2.2" fill="#1E3A8A"/><circle cx="23" cy="21" r="2.2" fill="#1E3A8A"/>
          <rect x="15" y="25.5" width="8" height="1.6" rx=".8" fill="#1E3A8A"/>
          <path fill="#fff" d="M12 33h14a3 3 0 0 1 3 3v4H9v-4a3 3 0 0 1 3-3z"/>
          <path fill="#fff" d="M37 15a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0v-6a3 3 0 0 1 3-3z"/>
          <path d="M32.5 23.5a4.5 4.5 0 0 0 9 0" fill="none" stroke="#fff" stroke-width="1.6"/>
          <rect x="36.2" y="28" width="1.6" height="4" fill="#fff"/>
        </svg>
        <span class="logo-text">Voice Capture</span>
      </a>

      <form id="search-form" class="side-search" role="search" autocomplete="off">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 1 0 3.4 9.8l3.6 3.7 1.1-1.1-3.7-3.6A5.5 5.5 0 0 0 8.5 3zm0 1.6a3.9 3.9 0 1 1 0 7.8 3.9 3.9 0 0 1 0-7.8z" fill="currentColor"/></svg>
        <input id="search-input" type="search" name="q" placeholder="Search conversations" aria-label="Search conversations" enterkeyhint="search">
        <kbd>/</kbd>
      </form>

      <nav class="side-nav" aria-label="Main">
        <a href="#/today" data-nav="today">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M6 2h1.6v1.5h4.8V2H14v1.5h1.5A2.5 2.5 0 0 1 18 6v9.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 2 15.5V6a2.5 2.5 0 0 1 2.5-2.5H6V2zM3.6 8v7.5c0 .5.4.9.9.9h11c.5 0 .9-.4.9-.9V8H3.6z"/></svg>
          <span>Today</span></a>
        <a href="#/" data-nav="days">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M3 4h14v1.6H3V4zm0 5.2h14v1.6H3V9.2zm0 5.2h9v1.6H3v-1.6z"/></svg>
          <span>All conversations</span></a>
        <a href="#/search" data-nav="search">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 1 0 3.4 9.8l3.6 3.7 1.1-1.1-3.7-3.6A5.5 5.5 0 0 0 8.5 3zm0 1.6a3.9 3.9 0 1 1 0 7.8 3.9 3.9 0 0 1 0-7.8z" fill="currentColor"/></svg>
          <span>Search</span></a>
        <a href="#/settings" data-nav="settings">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M8.6 2h2.8l.4 2.1c.5.2 1 .5 1.4.8l2-.7 1.4 2.4-1.6 1.4a5.6 5.6 0 0 1 0 1.6l1.6 1.4-1.4 2.4-2-.7c-.4.3-.9.6-1.4.8l-.4 2.1H8.6l-.4-2.1c-.5-.2-1-.5-1.4-.8l-2 .7-1.4-2.4L5 10.8a5.6 5.6 0 0 1 0-1.6L3.4 7.8l1.4-2.4 2 .7c.4-.3.9-.6 1.4-.8L8.6 2zM10 7.4a2.6 2.6 0 1 0 0 5.2 2.6 2.6 0 0 0 0-5.2z"/></svg>
          <span>Settings</span></a>
      </nav>

      <div class="side-foot">
        <button id="health-dot" class="status-btn" type="button" aria-label="Pipeline status">
          <span class="dot"></span><span id="health-label">Checking...</span>
        </button>
        <div id="health-pop" class="health-pop" hidden></div>
      </div>
    </aside>

    <main id="view" class="main" aria-live="polite">
      <p class="loading">Loading...</p>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js?v=2"></script>
</body>
</html>
